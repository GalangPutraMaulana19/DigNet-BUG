<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f0f23"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Network topology visualization -->
  
  <!-- Connection lines -->
  <line x1="200" y1="100" x2="200" y2="200" stroke="#667eea" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="200" x2="100" y2="280" stroke="#667eea" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="200" x2="300" y2="280" stroke="#667eea" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="200" x2="80" y2="180" stroke="#667eea" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.9s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="200" x2="320" y2="180" stroke="#667eea" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Central server node -->
  <circle cx="200" cy="200" r="30" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="r" values="30;32;30" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="200" y="205" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="white" font-weight="bold">SERVER</text>
  
  <!-- Top node - Internet/Cloud -->
  <circle cx="200" cy="80" r="25" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.8"/>
  <text x="200" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="white">WAN</text>
  
  <!-- Left node - Router -->
  <circle cx="80" cy="180" r="20" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.8"/>
  <text x="80" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="white">ROUTER</text>
  
  <!-- Right node - Router -->
  <circle cx="320" cy="180" r="20" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.8"/>
  <text x="320" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="white">SWITCH</text>
  
  <!-- Bottom left node - Device -->
  <rect x="75" y="265" width="50" height="35" rx="8" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.8"/>
  <text x="100" y="287" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="white">PC 1</text>
  
  <!-- Bottom right node - Device -->
  <rect x="275" y="265" width="50" height="35" rx="8" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.8"/>
  <text x="300" y="287" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="white">PC 2</text>
  
  <!-- Data packets flowing -->
  <circle cx="0" cy="0" r="4" fill="#00ff88" filter="url(#glow)">
    <animate attributeName="cx" values="200;200" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;200" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="4" fill="#00ff88" filter="url(#glow)">
    <animate attributeName="cx" values="200;100" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;280" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="4" fill="#00ff88" filter="url(#glow)">
    <animate attributeName="cx" values="200;300" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;280" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Status indicators -->
  <circle cx="200" cy="340" r="5" fill="#00ff88">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="215" y="344" font-family="Inter, sans-serif" font-size="10" fill="#00ff88">Connected</text>
</svg>
