<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#E21E2C"/>
  <circle cx="32" cy="32" r="30" fill="url(#gradient)" opacity="0.9"/>
  
  <!-- Network Nodes -->
  <circle cx="32" cy="16" r="4" fill="white"/>
  <circle cx="20" cy="28" r="4" fill="white"/>
  <circle cx="44" cy="28" r="4" fill="white"/>
  <circle cx="26" cy="44" r="4" fill="white"/>
  <circle cx="38" cy="44" r="4" fill="white"/>
  
  <!-- Connection Lines -->
  <line x1="32" y1="16" x2="20" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="44" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="28" x2="26" y2="44" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="38" y2="44" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="44" x2="38" y2="44" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Center Hub -->
  <circle cx="32" cy="32" r="6" fill="white"/>
  <circle cx="32" cy="32" r="3" fill="#E21E2C"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E21E2C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
